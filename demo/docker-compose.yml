services:
  risk-demo:
    build: .
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-17003}:7001"
    env_file:
      - .env
    environment:
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7001/health').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 30s
      timeout: 5s
      retries: 3
